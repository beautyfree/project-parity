name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/project-parity package/project-parity
          tar -czf project-parity-${{ matrix.target }}.tar.gz -C package project-parity
      - uses: softprops/action-gh-release@v2
        with:
          files: project-parity-${{ matrix.target }}.tar.gz
          generate_release_notes: true
